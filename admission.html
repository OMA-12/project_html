<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Information</title>
</head>
<body>
    <pre>
        <h3>
            <a href="index.html">Home</a>     <a href="about.html">about us</a>    <a href="courses.html">courses</a>   <a href="admission.html">admission</a>   <a href="timetable.html">timetable</a>   <a href="contact.html">contact us</a>    <a href="gallery.html">gallery</a>
        </h3>

    <h1>Admission Information</h1>
    <form action="success.html" method="get" enctype="multipart/form-data">
        <label for="first-name">First Name:</label>
        <input type="text" id="first-name" name="first-name" required><br><br>
        <label for="last-name">Last Name:</label>
        <input type="text" id="last-name" name="last-name" required><br><br>


        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required><br><br>
        <label for="gender">Gender:</label>
        <select id="gender" name="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select><br><br>

        <label for="course">Course of Interest:</label>
        <select id="course" name="course">
            <option value="cybersecurity">Cybersecurity</option>
            <option value="software-development">Software Development</option>
            <option value="ui-ux-design">UI/UX Design</option>
            <option value="data-science">Data Science</option>
        </select><br><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required><br><br>
        <label for="file-upload">File Upload:</label>
        <input type="file" id="file-upload" name="file-upload" required><br><br>
        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="4" cols="40" required></textarea><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        <label for="terms">I agree to the terms and conditions:</label>
        <input type="checkbox" id="terms" name="terms" required><br><br>
      <button type="submit">Submit Application</button>
        
    </form>
</body>
</html>
